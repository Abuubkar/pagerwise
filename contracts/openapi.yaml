openapi: 3.1.0
info:
  title: Pagerwise
  version: 0.5.0
  description: |
    Incident-response copilot. This file is the contract: the code is checked against it with
    `make contract-check`, and the Python client is generated from it with `make codegen`.
    Errors are RFC 9457 problems (`application/problem+json`) with a stable `code`; see docs/problems.md.

paths:
  /v1/ask:
    post:
      summary: Ask a question about the runbooks
      description: Answer from the local model. Every factual sentence cites a chunk as [Cn].
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AskRequest'}
      responses:
        '200':
          description: The answer, its verdict and the cited chunks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AskResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /v1/search:
    get:
      summary: Hybrid search over runbooks and postmortems, with every stage's rank
      description: |
        The retrieval that `ask` and triage use, exposed for debugging and evals. Full-text search and vector
        search each return their top 40 chunks; Reciprocal Rank Fusion (k=60) merges them; a cross-encoder
        reranker rescores the fused 40 and the top `k` are returned. Each result carries its rank and score at
        every stage (null where a chunk wasn't in that stage's top 40), and the response has per-stage timings.
      operationId: search
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 500}}
        - {name: k, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 40, default: 8}}
      responses:
        '200':
          description: Results, best first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '400': {$ref: '#/components/responses/Problem'}

  /v1/incidents:
    post:
      summary: Open an incident by hand
      operationId: createIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IncidentCreate'}
      responses:
        '201':
          description: The new incident.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '400': {$ref: '#/components/responses/Problem'}
    get:
      summary: List incidents, newest first
      description: |
        Keyset pagination on (opened_at DESC, id DESC). `next_cursor` is opaque and signed, and only valid with
        the same filters it was issued for; anything else is a 400 `invalid_cursor`.
      operationId: listIncidents
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: after
          in: query
          required: false
          description: next_cursor from the previous page
          schema:
            anyOf: [{type: string}, {type: 'null'}]
        - name: status
          in: query
          required: false
          schema:
            anyOf: [{$ref: '#/components/schemas/IncidentStatus'}, {type: 'null'}]
        - name: service
          in: query
          required: false
          schema:
            anyOf: [{type: string}, {type: 'null'}]
        - name: severity
          in: query
          required: false
          schema:
            anyOf: [{$ref: '#/components/schemas/Severity'}, {type: 'null'}]
      responses:
        '200':
          description: One page of incidents.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentPage'}
        '400': {$ref: '#/components/responses/Problem'}

  /v1/incidents/{incident_id}:
    get:
      summary: Get one incident
      operationId: getIncident
      parameters:
        - {$ref: '#/components/parameters/IncidentId'}
      responses:
        '200':
          description: The incident.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '404': {$ref: '#/components/responses/Problem'}

  /v1/incidents/{incident_id}/triage:
    post:
      summary: Queue a triage of the incident's current version
      description: |
        Returns 202 with the run's id; the triage worker generates the brief and `stream_url` streams it. While a
        triage of this incident version is queued or running, another request gets 409 `triage_in_progress` with
        that run's `triage_id`. A tenant that already has its limit of triages queued or running gets 503
        `triage_capacity` with a `Retry-After` header. Triages also start by themselves when alerts open an
        incident.
      operationId: startTriage
      parameters:
        - {$ref: '#/components/parameters/IncidentId'}
        - name: X-Pagerwise-Tenant
          in: header
          required: false
          description: Whose concurrency budget the triage counts against.
          schema: {type: string, minLength: 1, maxLength: 64, default: default}
      responses:
        '202':
          description: Triage queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TriageAccepted'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503':
          description: The tenant's triage limit is reached.
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema: {type: integer}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /v1/incidents/{incident_id}/triage/stream:
    get:
      summary: Stream the incident's latest triage
      description: |
        Server-sent events, from the triage's first event: live while the triage worker generates it, replayed
        from the stored result once it's finished. Any number of clients can watch the same triage. Each event's
        `data` is JSON:

        | event | data | when |
        |---|---|---|
        | `degraded_source` | DegradedSourceEvent | before the first token, once per evidence source left out |
        | `token` | TokenEvent | a piece of the brief's markdown, as the model writes it |
        | `citation` | CitationEvent | a complete [Cn] tag has arrived (a tag can be split across tokens) |
        | `section_complete` | SectionCompleteEvent | a section's text is finished |
        | `done` | TriageBrief | the brief passed the section and citation contract; last event |
        | `error` | ErrorEvent | generation failed or the brief broke the contract; last event |

        Concatenating the `token` texts gives exactly what the model wrote.
      operationId: streamTriage
      parameters:
        - {$ref: '#/components/parameters/IncidentId'}
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream:
              schema: {type: string}
        '404': {$ref: '#/components/responses/Problem'}

  /v1/admin/dlq/replay:
    post:
      summary: Republish dead letters to alerts.v1
      description: |
        Picks dead letters either by DLQ offset range (inclusive) or by message key (the service name), and
        republishes each stored payload to `alerts.v1` with an `x-replayed-from` header holding its DLQ offset.
        The consumer then processes them as new messages, so replay after fixing whatever sent them to the DLQ: a
        payload that is still malformed is dead-lettered again. Returns once Kafka has acknowledged every
        message, before the consumer has processed them. No authentication yet.
      operationId: replayDeadLetters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DlqReplayRequest'}
      responses:
        '202':
          description: Republished; the consumer processes them asynchronously.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DlqReplayAccepted'}
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

components:
  parameters:
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    ProblemCode:
      type: string
      enum: [invalid_request, invalid_cursor, not_found, triage_in_progress, model_unavailable, prompt_too_long,
             format_invalid, triage_abandoned, broker_unavailable, triage_capacity, triage_failed]
    Problem:
      type: object
      description: RFC 9457 problem details, plus our stable `code`.
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail:
          anyOf: [{type: string}, {type: 'null'}]
        code: {$ref: '#/components/schemas/ProblemCode'}
        triage_id:
          description: With triage_in_progress, the run that's already going.
          anyOf: [{type: string, format: uuid}, {type: 'null'}]

    Severity:
      type: string
      enum: [sev1, sev2, sev3, sev4]
    IncidentStatus:
      type: string
      enum: [open, acknowledged, resolved]
    SectionName:
      type: string
      enum: [likely_cause, blast_radius, first_steps, similar_incidents]

    IncidentCreate:
      type: object
      required: [title, service, severity]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        service: {type: string, minLength: 1, maxLength: 128}
        severity: {$ref: '#/components/schemas/Severity'}
        summary: {type: string, maxLength: 4000, default: ''}
        opened_at:
          description: When the incident started. Defaults to now.
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
    Incident:
      type: object
      required: [id, title, service, severity, status, summary, opened_at, version, created_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        service: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        status: {$ref: '#/components/schemas/IncidentStatus'}
        summary: {type: string}
        opened_at: {type: string, format: date-time}
        version:
          type: integer
          description: Goes up on every change; a triage belongs to the version it ran on.
        created_at: {type: string, format: date-time}
    IncidentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Incident'}
        next_cursor:
          description: Pass as `after` for the next page; null on the last page.
          anyOf: [{type: string}, {type: 'null'}]

    TriageAccepted:
      type: object
      required: [triage_id, incident_id, incident_version, stream_url]
      properties:
        triage_id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        incident_version: {type: integer}
        stream_url: {type: string}

    Citation:
      type: object
      required: [tag, source_type, source_id, chunk_id, chunk_excerpt]
      properties:
        tag: {type: string, description: 'The tag as written in the text, e.g. C3.'}
        source_type: {type: string, enum: [runbook, postmortem, deploy]}
        source_id: {type: string, description: 'The source: a document path (runbook, postmortem) or a deploy id.'}
        chunk_id:
          anyOf: [{type: string, format: uuid}, {type: 'null'}]
          description: The cited chunk of the document; null for a deploy.
        chunk_excerpt: {type: string}
    DegradedSource:
      type: object
      required: [source, reason]
      properties:
        source: {type: string, enum: [runbooks, postmortems, deploys]}
        reason: {type: string, description: "Why it was left out, e.g. 'timed out after 500 ms' or 'HTTP 503'."}
    BriefSection:
      type: object
      required: [text, citations]
      properties:
        text: {type: string}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
    BriefSections:
      type: object
      required: [likely_cause, blast_radius, first_steps, similar_incidents]
      properties:
        likely_cause: {$ref: '#/components/schemas/BriefSection'}
        blast_radius: {$ref: '#/components/schemas/BriefSection'}
        first_steps: {$ref: '#/components/schemas/BriefSection'}
        similar_incidents: {$ref: '#/components/schemas/BriefSection'}
    TriageUsage:
      type: object
      required: [prompt_tokens, output_tokens, ttft_ms, total_ms]
      properties:
        prompt_tokens: {type: integer}
        output_tokens: {type: integer}
        ttft_ms: {type: integer, description: Stream opened to first answer token.}
        total_ms: {type: integer}
    TriageBrief:
      type: object
      description: Data of the stream's `done` event.
      required: [triage_id, incident_id, incident_version, verdict, sections, model, prompt_version, usage,
                 degraded_sources]
      properties:
        triage_id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        incident_version: {type: integer}
        verdict:
          type: string
          enum: [CAUSE_IDENTIFIED, INSUFFICIENT_EVIDENCE]
        sections: {$ref: '#/components/schemas/BriefSections'}
        model: {type: string}
        prompt_version: {type: string}
        usage: {$ref: '#/components/schemas/TriageUsage'}
        degraded_sources:
          type: array
          items: {$ref: '#/components/schemas/DegradedSource'}
          description: Evidence sources that failed or timed out; the brief makes no claims about them.

    DegradedSourceEvent:
      type: object
      description: Data of the stream's `degraded_source` event, sent before the first token.
      required: [source, reason]
      properties:
        source: {type: string, enum: [runbooks, postmortems, deploys]}
        reason: {type: string, description: "Why it was left out, e.g. 'timed out after 500 ms' or 'HTTP 503'."}

    TokenEvent:
      type: object
      description: Data of the stream's `token` event.
      required: [text]
      properties:
        text: {type: string}
    CitationEvent:
      type: object
      description: Data of the stream's `citation` event.
      required: [tag, source_type, source_id, chunk_id, chunk_excerpt, section]
      properties:
        tag: {type: string}
        source_type: {type: string, enum: [runbook, postmortem, deploy]}
        source_id: {type: string, description: 'A document path (runbook, postmortem) or a deploy id.'}
        chunk_id:
          anyOf: [{type: string, format: uuid}, {type: 'null'}]
          description: The cited chunk of the document; null for a deploy.
        chunk_excerpt: {type: string}
        section:
          description: The section the tag was written in.
          anyOf: [{$ref: '#/components/schemas/SectionName'}, {type: 'null'}]
    SectionCompleteEvent:
      type: object
      description: Data of the stream's `section_complete` event.
      required: [section]
      properties:
        section: {$ref: '#/components/schemas/SectionName'}
    ErrorEvent:
      type: object
      description: Data of the stream's `error` event.
      required: [code, detail, problems]
      properties:
        code: {$ref: '#/components/schemas/ProblemCode'}
        detail: {type: string}
        problems:
          type: array
          items: {type: string}
          description: With format_invalid, each way the brief broke the section contract.

    AskRequest:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 3, maxLength: 2000}
    AskCitation:
      type: object
      required: [tag, chunk_id, document_path, heading_path, text]
      properties:
        tag: {type: string}
        chunk_id: {type: string, format: uuid}
        document_path: {type: string}
        heading_path: {type: string}
        text: {type: string}
    AskUsage:
      type: object
      required: [model, prompt_version, prompt_tokens, output_tokens, total_ms]
      properties:
        model: {type: string}
        prompt_version: {type: string}
        prompt_tokens: {type: integer}
        output_tokens: {type: integer}
        total_ms: {type: integer}
    AskResponse:
      type: object
      required: [answer_id, answer, verdict, citations, problems, usage]
      properties:
        answer_id: {type: string, format: uuid}
        answer: {type: string}
        verdict:
          type: string
          enum: [ANSWERED, INSUFFICIENT_EVIDENCE, REJECTED]
        citations:
          type: array
          items: {$ref: '#/components/schemas/AskCitation'}
        problems:
          type: array
          items: {type: string}
          description: Why a REJECTED answer failed the citation contract.
        usage: {$ref: '#/components/schemas/AskUsage'}

    DlqReplayRequest:
      type: object
      description: Either `from_offset` and `to_offset`, or `keys`.
      properties:
        from_offset: {type: integer, minimum: 0, description: First DLQ offset to replay.}
        to_offset: {type: integer, minimum: 0, description: Last DLQ offset to replay (inclusive); at most 10000 after from_offset.}
        keys:
          type: array
          items: {type: string, minLength: 1, maxLength: 255}
          minItems: 1
          maxItems: 100
          description: Replay every dead letter with one of these message keys (service names).
    DlqReplayAccepted:
      type: object
      required: [replayed, dlq_offsets]
      properties:
        replayed: {type: integer, description: Messages republished to alerts.v1.}
        dlq_offsets:
          type: array
          items: {type: integer}
          description: DLQ offsets of the replayed dead letters, in order.

    SearchHit:
      type: object
      required: [chunk_id, document_path, source_type, service, heading_path, excerpt, rrf_rank, rrf_score]
      properties:
        chunk_id: {type: string, format: uuid}
        document_path: {type: string}
        source_type: {type: string, enum: [runbook, postmortem]}
        service: {type: string}
        heading_path: {type: string}
        excerpt: {type: string, description: The chunk's first 280 characters.}
        fts_rank: {anyOf: [{type: integer}, {type: 'null'}], description: Rank in full-text search; null if not in its top 40.}
        fts_score: {anyOf: [{type: number}, {type: 'null'}], description: ts_rank_cd; higher is better.}
        vector_rank: {anyOf: [{type: integer}, {type: 'null'}], description: Rank in vector search; null if not in its top 40.}
        vector_distance: {anyOf: [{type: number}, {type: 'null'}], description: Cosine distance; lower is better.}
        rrf_rank: {type: integer}
        rrf_score: {type: number}
        rerank_rank: {anyOf: [{type: integer}, {type: 'null'}]}
        rerank_score: {anyOf: [{type: number}, {type: 'null'}], description: Cross-encoder logit; only the order is meaningful.}
    SearchTimings:
      type: object
      description: Milliseconds per stage. fts and vector overlap (they run concurrently); searches is both.
      required: [embed, fts, vector, searches, fuse, rerank, total]
      properties:
        embed: {type: number}
        fts: {type: number}
        vector: {type: number}
        searches: {type: number}
        fuse: {type: number}
        rerank: {type: number}
        total: {type: number}
    SearchResponse:
      type: object
      required: [query, candidates, results, timings_ms]
      properties:
        query: {type: string}
        candidates: {type: integer, description: Fused chunks the reranker scored.}
        results:
          type: array
          items: {$ref: '#/components/schemas/SearchHit'}
        timings_ms: {$ref: '#/components/schemas/SearchTimings'}

