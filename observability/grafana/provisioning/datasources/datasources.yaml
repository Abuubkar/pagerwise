apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Histogram exemplars carry the trace id of the span they were recorded in: click through to the trace.
      exemplarTraceIdDestinations: [{name: trace_id, datasourceUid: jaeger}]
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2: {datasourceUid: loki, filterByTraceID: true, spanStartTimeShift: "-1m", spanEndTimeShift: "1m"}
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      # OTLP logs keep trace_id as structured metadata: link each line to its trace.
      derivedFields:
        - {name: trace_id, matcherType: label, matcherRegex: trace_id, datasourceUid: jaeger, url: "$${__value.raw}"}
