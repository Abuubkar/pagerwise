services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: pagerwise
      POSTGRES_PASSWORD: pagerwise
      POSTGRES_DB: pagerwise
    ports:
      - "5435:5432"  # 5432-5434 are used by other local projects (Ledgerline is on 5434)
    volumes:
      # Postgres 18 images moved PGDATA under /var/lib/postgresql/18/; mount the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagerwise -d pagerwise"]
      interval: 2s
      timeout: 3s
      retries: 20

  redpanda:
    # Kafka API, one node. Topics come from scripts/topics.py, not auto-creation.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --set
      - redpanda.auto_create_topics_enabled=false
      # Two listeners: containers use redpanda:9092; the host (consumer, simulator, scripts) uses localhost:19092.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    # Pub/sub for live incident updates (the consumer publishes; slice 5's GraphQL subscription listens). No
    # persistence: a missed update is re-read from Postgres.
    image: redis:8.10.3
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Observability (docs/adr/0012). Apps on the host send OTLP to the collector on :4317; it tail-samples traces into
  # Jaeger (:16686), and forwards metrics to Prometheus (:9090) and logs to Loki. Grafana on :3000.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    depends_on: [jaeger, prometheus, loki]

  jaeger:
    # v2, all-in-one with in-memory storage: traces are gone on restart.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"  # UI and query API

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=15d  # the abstention alert compares with a 7-day baseline
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.9  # its default config takes OTLP logs on /otlp
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # local only: no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, jaeger, loki]

volumes:
  pgdata:
  redpanda:
  prometheus:
