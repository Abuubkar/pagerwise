[project]
name = "pagerwise"
version = "0.1.0"
description = "Workspace root: dev tooling and scripts. App code lives in apps/."
requires-python = ">=3.13"
dependencies = [
    "pagerwise-api",
    "pagerwise-consumer",
    "pagerwise-docs-mock",
    "pagerwise-indexer",
    "pagerwise-simulator",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.87.0",
    "faker>=40.44.0",
    "hypothesis>=6.170.14",
    "jinja2>=3.1.6",
    "openapi-python-client>=0.29.1",
    "pagerwise-client-sse",
    "pytest>=9.2.0",
    "testcontainers>=4.15.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/consumer", "apps/docs_mock", "apps/indexer", "apps/simulator", "packages/kafka", "packages/clients/python", "packages/client-sse"]

[tool.uv.sources]
pagerwise-api = { workspace = true }
pagerwise-consumer = { workspace = true }
pagerwise-docs-mock = { workspace = true }
pagerwise-indexer = { workspace = true }
pagerwise-kafka = { workspace = true }
pagerwise-simulator = { workspace = true }
pagerwise-client = { workspace = true }
pagerwise-client-sse = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/consumer/tests", "apps/indexer/tests", "packages/kafka/tests", "evals/tests"]
markers = ["integration: needs Docker (testcontainers); run with make test-int"]
# importlib: test files in different packages may share a name.
addopts = "--strict-markers --import-mode=importlib"
